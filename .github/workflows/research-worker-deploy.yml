name: Jarvis Research Worker (manual deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.JARVIS_RESEARCH_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check account credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'Cloudflare deploy credentials are missing in this GitHub repository.' >&2
            exit 1
          fi
      - name: Deploy isolated Jarvis research Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config cloudflare/wrangler.research.json
      - name: Check runtime readiness (requires Worker secrets)
        run: |
          curl -fsS --retry 3 --retry-delay 2 'https://jarvis-research.salcedo-cristhian-2020.workers.dev/health' | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const r=JSON.parse(s);if(r.ready!==true){console.error("Worker needs GEMINI_API_KEY/JARVIS_PILOT_TOKEN and rate limit binding");process.exitCode=1}else console.log("Jarvis research worker ready")})'
