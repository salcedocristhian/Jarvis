name: Jarvis validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and tests (GitHub Pages + API)
        run: npm run check && npm test
      - name: Check mirrored Node server
        run: cd servidor && npm run check && npm test
