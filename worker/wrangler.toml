# ÓNIX worker. Free plan. Deploy: npx wrangler deploy   (see ../SETUP-ONIX.md, step 6)
name = "onix"
main = "onix-worker.js"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ONIX_KV"
id = "PASTE_THE_KV_ID_HERE"   # npx wrangler kv namespace create ONIX_KV

[vars]
ALLOWED_ORIGIN = "https://salcedocristhian.github.io"
AGENT_ID = "agent_9601m7c4t540fh6v6nadake0hsrp"
ADMIN_HASHES = "192415de7da4a638b541cfd10a9ae75cd79a2d52463f27ee4bfa0629cb4565f2"
GUEST_DAILY_SECONDS = "60"
GUEST_MONTH_SECONDS = "6000"
ASK_DAILY = "80"

# Secrets, never here:  npx wrangler secret put ELEVENLABS_API_KEY
#                       npx wrangler secret put BRAVE_API_KEY      (optional, web search)
#                       npx wrangler secret put GEMINI_API_KEY     (optional, backup AI)
