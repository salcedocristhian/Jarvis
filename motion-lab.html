<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una, estudio de movimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04070C; --deep:#0A1A30; --line:#1F3D5E; --mesh:#3F7DB5;
  --sky:#93D0F0; --paper:#E6F0F7; --muted:#7F99AF; --brass:#C9A35C;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --text:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Una is a night instrument: same tokens in both modes */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#04070C;--paper:#E6F0F7}}
:root[data-theme="dark"]{--ink:#04070C;--paper:#E6F0F7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%, rgba(63,125,181,.16), transparent 60%)}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.top,.orb-wrap,#stage,.note,.dock{position:relative;z-index:1}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:8px}

.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 0;font-size:13px;color:var(--muted);position:relative}
.demo{font-size:11px;letter-spacing:.1em;color:var(--brass);border:1px solid rgba(201,163,92,.5);border-radius:99px;padding:2px 9px}

.orb-wrap{display:grid;place-items:center;padding-top:4px;position:relative}
#orb{width:148px;height:148px;display:block;margin:-18px 0;position:relative;z-index:1}

#stage{position:relative;display:grid;place-items:center;padding:8px 20px;min-height:0;perspective:1100px}
.tilt{width:min(100%,540px);transform-style:preserve-3d}
.scene{position:relative;width:100%;transform-style:preserve-3d}

.note{margin:0 auto;text-shadow:0 1px 8px var(--ink);padding:6px 22px 10px;max-width:46ch;text-align:center;font-size:14px;line-height:1.45;color:var(--muted);min-height:3.6em}

.dock{padding:0 0 12px;position:relative}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:rgba(10,26,48,.7);border-radius:99px;padding:9px 15px;font-size:14px;cursor:pointer;min-height:40px;transition:background .25s,border-color .25s,color .25s}
.chip[aria-current="true"]{background:var(--sky);border-color:var(--sky);color:var(--ink);font-weight:600}
.ctrl{display:flex;justify-content:center;gap:10px;padding:0 16px}
.ctrl button{border:0;background:none;color:var(--sky);font-size:14px;padding:8px 12px;min-height:40px;cursor:pointer;border-radius:10px}
.ctrl button[aria-pressed="true"]{color:var(--brass)}

/* --- shared HUD pieces --- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.beam{position:fixed;width:2px;margin-left:-1px;transform-origin:50% 0;
  background:linear-gradient(var(--sky),rgba(147,208,240,0));box-shadow:0 0 12px 2px rgba(147,208,240,.55)}
.px{position:fixed;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--sky);box-shadow:0 0 8px var(--sky)}
.px.b{background:var(--brass);box-shadow:0 0 8px var(--brass)}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;white-space:pre}
.c.scr{color:var(--brass);opacity:.75}
.c.wait{opacity:0}

/* headline */
.kicker{margin:0;font-size:14px;color:var(--muted)}
.hl{font-family:var(--display);font-weight:800;font-size:clamp(28px,8.4vw,50px);line-height:1.06;letter-spacing:-.03em;color:var(--sky);margin:12px 0 0;text-wrap:balance}
.scan{position:absolute;left:-12px;right:-12px;top:0;height:2px;background:var(--sky);box-shadow:0 0 18px 3px rgba(147,208,240,.7);opacity:0}
.dim{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:13px;color:var(--muted)}
.dim .dl{flex:1;height:1px;background:var(--mesh);position:relative}
.dim .dl::before{content:"";position:absolute;top:-5px;width:1px;height:11px;background:var(--mesh)}
.dim .dl.l::before{left:0} .dim .dl.r::before{right:0}
.dim .dl.l{transform-origin:100% 50%} .dim .dl.r{transform-origin:0 50%}

/* number */
.gauge{position:relative;width:min(68vw,270px);aspect-ratio:1;margin:0 auto}
.gauge svg{width:100%;height:100%;overflow:visible}
.g-ticks{fill:none;stroke:var(--mesh);stroke-width:2.2;stroke-dasharray:.5 4.32}
.g-track{fill:none;stroke:var(--line);stroke-width:1.2}
.g-arc{fill:none;stroke:var(--brass);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:251.33;stroke-dashoffset:251.33;filter:drop-shadow(0 0 3px rgba(201,163,92,.8))}
.g-inner{fill:none;stroke:rgba(147,208,240,.35);stroke-width:.5;stroke-dasharray:6 3}
.g-orbit{position:absolute;inset:0}
.g-orbit i{position:absolute;left:50%;top:10%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--brass);box-shadow:0 0 12px 3px rgba(201,163,92,.7)}
.g-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.g-val{font-family:var(--display);font-weight:700;font-size:clamp(26px,8vw,38px);color:var(--brass);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.g-lab{font-size:14px;color:var(--muted);margin-top:6px}
.cap{text-align:center;margin:16px auto 0;max-width:30ch;font-size:16px;line-height:1.4}

/* evidence */
.holo{position:relative;padding:24px 22px 20px;border:1px solid rgba(147,208,240,.32);
  background:linear-gradient(180deg,rgba(147,208,240,.10),rgba(10,26,48,.62) 60%);clip-path:inset(50% 0 50% 0)}
.holo::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(147,208,240,.06) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.seam{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--sky);box-shadow:0 0 16px 3px rgba(147,208,240,.7);transform:scaleX(0)}
.ev-wrap{position:relative}
.cn{position:absolute;width:18px;height:18px;border:2px solid var(--sky);opacity:0}
.cn.tl{left:-6px;top:-6px;border-right:0;border-bottom:0}
.cn.tr{right:-6px;top:-6px;border-left:0;border-bottom:0}
.cn.bl{left:-6px;bottom:-6px;border-right:0;border-top:0}
.cn.br{right:-6px;bottom:-6px;border-left:0;border-top:0}
.h-t{font-family:var(--display);font-weight:500;font-size:clamp(19px,5.4vw,25px);line-height:1.2;margin:0;color:var(--paper);letter-spacing:-.01em}
.h-d{margin:12px 0 0;font-size:16px;line-height:1.45;color:#B9CCDB}
.h-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.stamp{position:relative;font-weight:600;font-size:13px;color:var(--brass);border:1.5px solid var(--brass);border-radius:6px;padding:4px 10px;opacity:0}
.stamp .rip{position:absolute;inset:-2px;border:1.5px solid var(--brass);border-radius:8px;opacity:0}
.h-date{font-size:13px;color:var(--muted)}

/* mail */
.m-head{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,30px);color:var(--sky);margin:0 0 16px;letter-spacing:-.02em}
.mail{perspective:900px;display:grid;gap:10px}
.m{display:grid;grid-template-columns:12px 1fr auto;column-gap:10px;row-gap:2px;align-items:baseline;padding:14px 16px;
  border:1px solid var(--line);border-radius:14px;background:rgba(10,26,48,.82);opacity:0;transform-origin:50% 0}
.m .dot{grid-row:1/3;align-self:center;width:8px;height:8px;border-radius:50%;background:transparent;position:relative}
.m.unread .dot{background:var(--sky);box-shadow:0 0 10px var(--sky)}
.m .from{font-weight:600;font-size:15px}
.m .time{font-size:13px;color:var(--muted)}
.m .subj{grid-column:2/4;font-size:15px;color:#B9CCDB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* insight network */
.net{position:relative;width:100%;aspect-ratio:100/64}
.net svg{position:absolute;inset:0;width:100%;height:100%}
.net line{stroke:var(--sky);stroke-width:.45;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(147,208,240,.8))}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;opacity:0}
.node i{width:12px;height:12px;border:2px solid var(--sky);border-radius:50%;background:var(--ink)}
.node span{font-size:13px;font-weight:600;white-space:nowrap}
.hub{position:absolute;left:50%;top:46.9%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--brass);box-shadow:0 0 22px 6px rgba(201,163,92,.55);transform:scale(0)}
.hub-ring{position:absolute;left:50%;top:46.9%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid var(--brass);opacity:0}
.ins{font-family:var(--display);font-weight:500;font-size:clamp(18px,5vw,24px);line-height:1.25;text-align:center;margin:8px auto 0;max-width:24ch;letter-spacing:-.01em}

/* action */
.target{position:relative;padding:30px 26px 26px}
.br{position:absolute;width:26px;height:26px;border:2.5px solid var(--brass);opacity:0}
.br.tl{left:0;top:0;border-right:0;border-bottom:0}
.br.tr{right:0;top:0;border-left:0;border-bottom:0}
.br.bl{left:0;bottom:0;border-right:0;border-top:0}
.br.bb{right:0;bottom:0;border-left:0;border-top:0}
.xh{width:34px;height:34px;display:block;margin-bottom:14px;opacity:0}
.xh *{fill:none;stroke:var(--brass);stroke-width:2}
.act{font-family:var(--display);font-weight:500;font-size:clamp(20px,5.8vw,28px);line-height:1.2;margin:0;letter-spacing:-.015em;text-wrap:balance}
.charge{margin-top:22px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.charge i{display:block;height:100%;background:var(--brass);transform:scaleX(0);transform-origin:0 50%;box-shadow:0 0 10px var(--brass)}
.charge-lab{margin:8px 0 0;font-size:13px;color:var(--muted);opacity:0}

#mandala{position:absolute;left:50%;top:calc(50% + 2px);width:230px;height:230px;margin:-115px 0 0 -115px;pointer-events:none;opacity:0;overflow:visible}
#mandala .ln{fill:none;stroke:var(--brass);stroke-width:.8}
#mandala .sk{fill:none;stroke:var(--sky);stroke-width:.7}
#mandala text{font:500 7.2px var(--text);fill:var(--sky);letter-spacing:.6px}
.hint{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted)}
#stage{touch-action:none;-webkit-user-select:none;user-select:none}
.dragging{cursor:grabbing}
/* voice */
.vox-t{font-family:var(--display);font-weight:500;font-size:clamp(22px,6.4vw,32px);line-height:1.3;text-align:center;letter-spacing:-.01em;margin:0;text-wrap:balance}
.vw{color:rgba(127,153,175,.35);transition:color .3s,text-shadow .3s}
.vw.said{color:var(--paper)}
.vw.now{color:var(--sky);text-shadow:0 0 18px rgba(147,208,240,.85)}
/* building */
.bld-cv{width:100%;height:min(38vh,330px);display:block;touch-action:none;cursor:grab}
.bld-card{min-height:4.6em;margin-top:4px;padding:12px 16px;border-left:2px solid var(--brass);background:linear-gradient(90deg,rgba(201,163,92,.12),transparent);opacity:0}
.bld-card b{display:block;font-family:var(--display);font-weight:500;font-size:17px;margin-bottom:4px}
.bld-card span{font-size:15px;color:#B9CCDB;line-height:1.4}
.bld-card.ok{border-color:var(--sky);background:linear-gradient(90deg,rgba(147,208,240,.10),transparent)}
/* terrain chart */
.ter{text-align:center;padding-bottom:4px}
.ter .kicker{text-shadow:0 1px 8px var(--ink)}
.ter-h{font-family:var(--display);font-weight:500;font-size:clamp(19px,5.4vw,24px);margin:6px 0 0;color:var(--paper);text-shadow:0 2px 12px var(--ink);letter-spacing:-.01em}
.pk{position:fixed;left:0;top:0;opacity:0;will-change:transform}
.pk-in{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;padding-bottom:40px;white-space:nowrap}
.pk-v{font-family:var(--display);font-weight:700;font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px var(--ink)}
.pk.main .pk-v{font-size:clamp(22px,6.4vw,30px)}
.pk-n{font-size:12px;color:var(--muted);text-shadow:0 1px 6px var(--ink)}
.pk.main .pk-n{font-size:13px;color:var(--paper)}
.pk-l{position:absolute;left:50%;bottom:4px;height:32px;width:1px;background:linear-gradient(rgba(201,163,92,0),var(--brass))}
.pk-d{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--brass);box-shadow:0 0 12px 3px rgba(201,163,92,.7)}
/* laser plotter */
.plot .holo{clip-path:none;background:none;border-color:transparent}
.plot .holo::before{display:none}
.plot .fill{position:absolute;inset:0;opacity:0;border:1px solid rgba(147,208,240,.32);
  background:repeating-linear-gradient(0deg,rgba(147,208,240,.05) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(147,208,240,.10),rgba(10,26,48,.62) 60%)}
.plot .holo > :not(.fill){position:relative}
.outline{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.outline rect{fill:none;stroke:var(--sky);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1}
.head{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:1px;background:#fff;z-index:3;opacity:0;offset-anchor:50% 50%;
  box-shadow:0 0 8px 2px var(--sky),0 0 26px 8px rgba(147,208,240,.45)}
.head::after{content:"";position:absolute;left:3px;bottom:100%;width:2px;height:70px;background:linear-gradient(rgba(147,208,240,0),rgba(147,208,240,.8))}
/* paper */
.fold{perspective:700px;margin:-4px 10px 0}
.f1,.f2{background:var(--paper);color:var(--ink);padding:10px 14px;font-size:14px;line-height:1.4;transform-origin:50% 0;backface-visibility:hidden;box-shadow:0 12px 20px -12px rgba(0,0,0,.7)}
.f2{background:#D3E1EC;border-radius:0 0 10px 10px}
/* mechanical action */
.mech{position:relative;padding:30px 26px 24px}
.rail{position:absolute;background:var(--brass);opacity:.55}
.rail.t,.rail.b{left:30px;right:30px;height:1.5px} .rail.t{top:0} .rail.b{bottom:0}
.rail.l,.rail.r{top:30px;bottom:30px;width:1.5px} .rail.l{left:0} .rail.r{right:0}
.pc{position:absolute;width:28px;height:28px;border:3px solid var(--brass)}
.pc.tl{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.pc.tr{right:-1px;top:-1px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.pc.bl{left:-1px;bottom:-1px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.pc.bb{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.rings{width:44px;height:44px;display:block;margin-bottom:14px;overflow:visible}
.rings *{fill:none;stroke:var(--brass);stroke-width:1.6}
.rings .r1{stroke-dasharray:2 1} .rings .r2{stroke-dasharray:1.5 .5} .rings .r3{fill:var(--brass);stroke:none}
.shut{position:relative;overflow:hidden}
.sh{position:absolute;left:0;right:0;height:51%;background:linear-gradient(180deg,#132a45,#0b1a2e);z-index:1}
.sh.t{top:0;border-bottom:2px solid var(--brass)} .sh.b{bottom:0;border-top:2px solid var(--brass)}
.cells{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:22px}
.cells i{height:6px;border-radius:1px;background:var(--line)}

@media (max-height:640px){#orb{width:112px;height:112px;margin:-14px 0}.note{min-height:0;font-size:13px}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<header class="top"><span>Estudio de movimiento para Una</span><span class="demo">DEMO</span></header>
<div class="orb-wrap"><svg id="mandala" viewBox="-110 -110 220 220" aria-hidden="true"></svg><canvas id="orb" aria-hidden="true"></canvas></div>
<main id="stage" aria-live="polite"><div class="tilt" id="tilt"></div></main>
<p class="note" id="note"></p>
<nav class="dock" aria-label="Escenas">
  <div class="chips" id="chips"></div>
  <div class="ctrl">
    <button id="replay" type="button">Repetir escena</button>
    <button id="slow" type="button" aria-pressed="false">Cámara lenta</button>
    <button id="sound" type="button" aria-pressed="false">Sonido</button>
  </div>
  <p class="hint">Arrastra cualquier cuadro y lánzalo hacia el orbe</p>
</nav>
<div id="fx" aria-hidden="true"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const tilt = $("#tilt"), fx = $("#fx"), note = $("#note"), orbCv = $("#orb");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,.8,.2,1)", BACK = "cubic-bezier(.3,1.5,.4,1)", SNAP = "cubic-bezier(.7,0,.2,1)";
let speed = 1, runId = 0, current = "full";
const T = ms => RM ? 0 : ms * speed;
const STOP = Symbol("stop");

/* ---------- tiny engine ---------- */
function ctxFor(id){
  const alive = () => id === runId;
  return {
    alive,
    async w(p){ await p; if(!alive()) throw STOP; },
    sleep(ms){ return this.w(new Promise(r => setTimeout(r, T(ms)))); }
  };
}
function anim(el, kf, o = {}){
  const a = el.animate(kf, { duration:T(o.dur ?? 600), delay:T(o.delay ?? 0), easing:o.ease || EASE, fill:"both" });
  return a.finished.catch(() => {});
}
function mk(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function build(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

const GLYPHS = "▚▞▙▟░▒▓/\\<>+=ΔΞ#0123456789";
const rg = () => GLYPHS[Math.random() * GLYPHS.length | 0];
/* Decode: each letter arrives as noise and locks into place, left to right */
function decode(el, text, ctx, { dur = 900, delay = 0 } = {}){
  el.textContent = ""; el.setAttribute("aria-label", text);
  const chars = [];
  text.split(/(\s+)/).forEach(part => {
    if(!part) return;
    if(/^\s+$/.test(part)){ el.append(document.createTextNode(" ")); return; }
    const w = mk("span","w"); w.setAttribute("aria-hidden","true");
    for(const ch of part){ const c = mk("span","c wait", ch); c.dataset.ch = ch; w.append(c); chars.push(c); }
    el.append(w);
  });
  const n = chars.length || 1, D = T(dur), d0 = T(delay);
  const plan = chars.map((c,i) => ({ c, show:d0 + (i/n)*D*.45, lock:d0 + (i/n)*D*.7 + Math.random()*D*.3 }));
  if(!D){ chars.forEach(c => { c.className = "c"; }); return Promise.resolve(); }
  return new Promise(res => {
    const t0 = performance.now(); let lastSwap = 0;
    const tick = now => {
      if(!ctx.alive()) return res();
      const t = now - t0, swap = now - lastSwap > 45; if(swap) lastSwap = now;
      let done = 0;
      for(const p of plan){
        if(t >= p.lock){ if(p.c.className !== "c"){ p.c.className = "c"; p.c.textContent = p.c.dataset.ch; } done++; }
        else if(t >= p.show){ if(p.c.className !== "c scr") p.c.className = "c scr"; if(swap) p.c.textContent = rg(); }
      }
      done < plan.length ? requestAnimationFrame(tick) : res();
    };
    requestAnimationFrame(tick);
  });
}
function countUp(el, to, ctx, { dur = 1500, fmt = v => v } = {}){
  const D = T(dur);
  if(!D){ el.textContent = fmt(to); return Promise.resolve(); }
  return new Promise(res => {
    const t0 = performance.now();
    const tick = now => {
      if(!ctx.alive()) return res();
      const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(2, -10 * k);
      el.textContent = fmt(k < 1 ? to * e : to);
      k < 1 ? requestAnimationFrame(tick) : res();
    };
    requestAnimationFrame(tick);
  });
}
const usd = v => "$" + v.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });

/* ---------- orb ---------- */
const orb = (() => {
  const g = orbCv.getContext("2d"), N = 340, pts = [];
  for(let i = 0; i < N; i++){
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y*y), th = i * 2.39996;
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
  }
  let energy = 0, implode = 0, ang = 0, W = 0, dpr = 1, vTarget = 0, vLev = 0;
  function size(){ dpr = Math.min(2, devicePixelRatio || 1); W = orbCv.clientWidth; orbCv.width = orbCv.height = W * dpr; }
  size(); addEventListener("resize", size);
  function frame(){
    energy *= .965; implode *= .93;
    ang += .004 + energy * .05;
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,W);
    vLev += (vTarget - vLev)*.35;
    const c = W/2, R = W * .272 * (1 - implode * .45 + energy * .06 + vLev * .07);
    const glow = g.createRadialGradient(c,c,0,c,c,R*1.5);
    glow.addColorStop(0, `rgba(147,208,240,${.16 + energy*.3})`); glow.addColorStop(1,"rgba(147,208,240,0)");
    g.fillStyle = glow; g.beginPath(); g.arc(c,c,R*1.5,0,7); g.fill();
    const ca = Math.cos(ang), sa = Math.sin(ang), tx = .38, ct = Math.cos(tx), st = Math.sin(tx);
    for(let i = 0; i < N; i++){
      let [x,y,z] = pts[i];
      const x1 = x*ca + z*sa, z1 = -x*sa + z*ca;
      const y2 = y*ct - z1*st, z2 = y*st + z1*ct;
      const d = (z2 + 1) / 2;
      g.fillStyle = (i % 9 === 0 && energy > .25) ? `rgba(201,163,92,${.4+d*.6})` : `rgba(147,208,240,${.18 + d*.72})`;
      const s = .6 + d * 1.3;
      g.fillRect(c + x1*R - s/2, c + y2*R - s/2, s, s);
    }
    g.strokeStyle = `rgba(201,163,92,${.35 + energy*.5})`; g.lineWidth = 1;
    g.beginPath(); g.ellipse(c, c, R*1.18, R*.26, -.2, 0, Math.PI*2); g.stroke();
    if(vLev > .01){
      const tt = performance.now()/1000, n = 72;
      g.lineWidth = 1.6; g.lineCap = "round";
      for(let i = 0; i < n; i++){
        const a = i/n*Math.PI*2, k = Math.abs(Math.sin(i*.9 + tt*7 + Math.sin(i*.37 + tt*2)*3));
        const v = vLev*(.3 + .7*k)*(.8 + .2*Math.random()), r1 = R*1.3, r2 = r1 + 2 + v*W*.2;
        g.strokeStyle = `rgba(147,208,240,${.25 + .7*v})`;
        g.beginPath(); g.moveTo(c + Math.cos(a)*r1, c + Math.sin(a)*r1); g.lineTo(c + Math.cos(a)*r2, c + Math.sin(a)*r2); g.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {
    flash(v = 1){ energy = Math.max(energy, v); },
    voice(v){ vTarget = v; },
    suck(){ implode = 1; setTimeout(() => { energy = 1; }, T(380)); },
    center(){ const r = orbCv.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
  };
})();

/* the orb throws a beam of light at whatever is about to appear */
function beam(target){
  orb.flash(1);
  const [ox, oy] = orb.center(), r = target.getBoundingClientRect();
  const tx = r.left + r.width/2, ty = r.top + 4;
  const len = Math.hypot(tx-ox, ty-oy), a = Math.atan2(tx-ox, ty-oy);
  const b = mk("i","beam"); b.style.left = ox+"px"; b.style.top = oy+"px"; b.style.height = len+"px";
  b.style.transform = `rotate(${-a}rad)`; fx.append(b);
  return anim(b, [{transform:`rotate(${-a}rad) scaleY(0)`,opacity:1},{transform:`rotate(${-a}rad) scaleY(1)`,opacity:1,offset:.55},{transform:`rotate(${-a}rad) scaleY(1)`,opacity:0}], {dur:520, ease:"linear"})
    .then(() => b.remove());
}

/* ---------- the field: a breathing mesh + suspended dust that can become words ---------- */
const field = (() => {
  const cv = $("#field"), g = cv.getContext("2d");
  const ROWS = 24, COLS = 40, DUST = 900;
  let W = 0, H = 0, dpr = 1, t = 0, last = performance.now();
  let energy = 0, pulse = 2, pulseAmp = 0;
  const A = [];
  for(let r = 0; r < ROWS; r++) for(let c = 0; c <= COLS; c++) A.push({kind:"mesh", r, c, z:r/(ROWS-1), u:c/COLS, x:0, y:0, mode:"home", att:1, flash:0, ph:Math.random()*7});
  const MESH = A.length;
  for(let i = 0; i < DUST; i++) A.push({kind:"dust", bx:Math.random(), by:Math.random(), sp:.15+Math.random()*.35, ph:Math.random()*7, x:0, y:0, mode:"home", att:1, flash:0});
  function size(){ dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; }
  size(); addEventListener("resize", size);

  const wave = (x, y, t) => Math.sin(x*1.3 + t)*.5 + Math.sin(y*1.7 - t*.8)*.35 + Math.sin((x+y)*.9 + t*.6)*.25;
  let mounts = [];
  function meshPoint(u, z){
    const horizon = H*.5, y0 = horizon + Math.pow(z,1.8)*(H - horizon + 80), sp = .35 + z*1.7;
    const amp = 12 + energy*38 + pulseAmp*46*Math.exp(-Math.pow(z - pulse, 2)*55);
    let lift = 0, rise = 0;
    for(const m of mounts){ const gs = Math.exp(-((u - m.u)**2)/m.su - ((z - m.z)**2)/m.sz); rise += gs*m.cur; lift = Math.max(lift, gs*Math.min(1, m.cur*4)); }
    return [W/2 + (u - .5)*W*sp, y0 - wave(u*6, z*5, t)*amp*(.3 + z) - rise*H*.26, lift];
  }
  function home(a){
    if(a.kind === "mesh"){ const p = meshPoint(a.u, a.z); a.lift = p[2]; return p; }
    return [a.bx*W + Math.sin(t*a.sp + a.ph)*22, a.by*H*.92 + Math.cos(t*a.sp*.8 + a.ph)*16];
  }
  const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
  function setTween(a, tw, now){ tw.t0 = now + (tw.delay || 0); tw.live = a.mode === "home"; tw.fx = a.x; tw.fy = a.y; a.tw = tw; }

  function step(a, now){
    if(a.mode === "home" && !a.tw){ [a.x, a.y] = home(a); a.att = 1; return; }
    if(a.mode === "bound" && !a.tw){
      a.x = a.tx + Math.sin(t*3 + a.ph)*.35; a.y = a.ty + Math.cos(t*2.6 + a.ph)*.35; a.att = 0; return;
    }
    const tw = a.tw, k = (now - tw.t0)/tw.dur;
    if(k < 0){ if(tw.live){ [a.x, a.y] = home(a); tw.fx = a.x; tw.fy = a.y; } return; }
    const e = ease(Math.min(1, k));
    const [tx, ty] = tw.to === "home" ? home(a) : tw.to === "orb" ? orb.center() : tw.to;
    const cx = (tw.fx + tx)/2 + tw.ox, cy = (tw.fy + ty)/2 + tw.oy, i = 1 - e;
    a.x = i*i*tw.fx + 2*i*e*cx + e*e*tx; a.y = i*i*tw.fy + 2*i*e*cy + e*e*ty;
    a.att = a.mode === "out" ? Math.pow(1 - e, 2) : a.mode === "back" ? e*e : a.att;
    if(k >= 1){
      a.tw = null;
      if(tw.next){ setTween(a, tw.next, now); a.tw.fx = a.x; a.tw.fy = a.y; a.tw.live = false; return; }
      if(a.mode === "out"){ a.mode = "bound"; a.flash = 1; }
      else if(a.mode === "back"){ a.mode = "home"; a.flash = .6; }
    }
  }

  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now; t += dt*(RM ? .15 : 1);
    energy *= .985; if(pulse < 1.6){ pulse += dt*.75; pulseAmp *= .995; } else pulseAmp = 0;
    mounts = mounts.filter(m => {
      const k = Math.max(0, Math.min(1, (now - m.t0)/(m.dur || 1))), q = k - 1;
      const e = m.up ? 1 + 2.4*q*q*q + 1.4*q*q : (k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2);
      m.cur = m.from + (m.to - m.from)*e;
      return !(m.to === 0 && k >= 1);
    });
    for(const a of A) step(a, now);
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    const gl = g.createRadialGradient(W/2, H*.36, 0, W/2, H*.36, Math.max(W,H)*.75);
    gl.addColorStop(0, `rgba(40,92,150,${.26 + energy*.18})`); gl.addColorStop(.55, "rgba(10,26,48,.18)"); gl.addColorStop(1, "rgba(4,7,12,0)");
    g.fillStyle = gl; g.fillRect(0,0,W,H);
    // mesh lines, bucketed by alpha so the canvas stays fast on a phone
    const B = Array.from({length:10}, () => []);
    const BB = Array.from({length:10}, () => []);
    const seg = (a, b, base) => {
      const m = Math.min(a.att, b.att), lf = Math.max(a.lift || 0, b.lift || 0);
      if(lf > .06){ const al = (base + lf*.6)*m; if(al > .01) BB[Math.min(9, al*12 | 0)].push(a.x, a.y, b.x, b.y); return; }
      const al = base*m; if(al > .01) B[Math.min(9, al*30 | 0)].push(a.x, a.y, b.x, b.y); };
    for(let r = 0; r < ROWS; r++){ const base = .05 + (r/(ROWS-1))*.28;
      for(let c = 0; c < COLS; c++) seg(A[r*(COLS+1)+c], A[r*(COLS+1)+c+1], base); }
    for(let c = 0; c <= COLS; c += 2) for(let r = 0; r < ROWS-1; r++) seg(A[r*(COLS+1)+c], A[(r+1)*(COLS+1)+c], .1);
    g.lineWidth = 1;
    B.forEach((L, i) => { if(!L.length) return; g.strokeStyle = `rgba(63,125,181,${(i + .5)/30})`; g.beginPath();
      for(let j = 0; j < L.length; j += 4){ g.moveTo(L[j], L[j+1]); g.lineTo(L[j+2], L[j+3]); } g.stroke(); });
    BB.forEach((L, i) => { if(!L.length) return; g.strokeStyle = `rgba(201,163,92,${(i + .5)/12})`; g.beginPath();
      for(let j = 0; j < L.length; j += 4){ g.moveTo(L[j], L[j+1]); g.lineTo(L[j+2], L[j+3]); } g.stroke(); });
    // particles
    g.globalCompositeOperation = "lighter";
    for(const a of A){
      if(a.x < -20 || a.x > W+20 || a.y < -20 || a.y > H+20) continue;
      let s, al, col = "147,208,240";
      if(a.mode === "home"){
        if(a.kind === "mesh"){ if(a.flash < .05) continue; s = 1.4; al = a.flash*.8; }
        else { s = 1.3; al = .16 + .14*Math.sin(t*1.7 + a.ph); }
      } else if(a.mode === "bound"){
        const dim = a.grp && a.grp.dim;
        s = dim ? 1.3 : 2; al = dim ? .28 + .22*Math.sin(t*4 + a.ph*3) : .95;
      } else { s = 1.7; al = .85; }
      g.globalAlpha = Math.max(0, al); g.fillStyle = `rgb(${col})`; g.fillRect(a.x - s/2, a.y - s/2, s, s);
      if(a.flash > .05){ const f = a.flash, fs = s + f*3.5; g.globalAlpha = f*.9; g.fillStyle = "rgb(201,163,92)"; g.fillRect(a.x - fs/2, a.y - fs/2, fs, fs); a.flash *= .9; }
    }
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* rasterise the DOM text where it sits, then call particles to every inked pixel */
  function sample(el, budget){
    const R = el.getBoundingClientRect(), cs = getComputedStyle(el);
    const oc = document.createElement("canvas"); oc.width = Math.ceil(R.width); oc.height = Math.ceil(R.height);
    const o = oc.getContext("2d");
    o.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
    el.querySelectorAll(".c").forEach(c => { const r = c.getBoundingClientRect(); o.fillText(c.dataset.ch, r.left - R.left + r.width/2, r.top - R.top + r.height/2 + parseFloat(cs.fontSize)*.04); });
    const d = o.getImageData(0, 0, oc.width, oc.height).data;
    let st = 2, pts;
    do{
      pts = [];
      for(let y = 0; y < oc.height; y += st) for(let x = (y/st & 1) ? st/2 | 0 : 0; x < oc.width; x += st)
        if(d[((y|0)*oc.width + (x|0))*4 + 3] > 140) pts.push([R.left + x, R.top + y]);
      st += .5;
    } while(pts.length > budget && st < 9);
    return { pts, R };
  }

  return {
    form(el, { max = 1500, spread = 1 } = {}){
      const free = A.filter(a => a.mode === "home" || a.mode === "back");
      const onScreen = free.filter(a => a.x > -10 && a.x < W+10 && a.y > -10 && a.y < H+10);
      const pool = onScreen.length > 300 ? onScreen.concat(free.filter(a => !onScreen.includes(a))) : free;
      const { pts, R } = sample(el, Math.min(max, pool.length));
      const chosen = pool.slice().sort(() => Math.random() - .5).slice(0, pts.length).sort((p, q) => p.x - q.x);
      pts.sort((p, q) => p[0] - q[0]);
      const grp = { agents:chosen, dim:false };
      const now = performance.now(); let longest = 0;
      chosen.forEach((a, i) => {
        const [tx, ty] = pts[i], dx = tx - a.x, dy = ty - a.y, len = Math.hypot(dx, dy) || 1;
        const sw = (Math.random() - .5)*len*.7*spread;
        const delay = ((tx - R.left)/R.width)*T(520) + Math.random()*T(260), dur = T(950 + Math.random()*650);
        setTween(a, { to:[tx, ty], dur, delay, ox:-dy/len*sw, oy:dx/len*sw }, now);
        a.mode = "out"; a.grp = grp; a.tx = tx; a.ty = ty;
        longest = Math.max(longest, delay + dur);
      });
      energy = Math.max(energy, .8);
      grp.done = new Promise(r => setTimeout(r, longest + 40));
      return grp;
    },
    settle(grp){ grp.dim = true; pulse = 0; pulseAmp = 1; energy = Math.max(energy, .5); },
    release(grps, to = "home"){
      const now = performance.now();
      for(const grp of grps) for(const a of grp.agents){
        if(a.grp !== grp) continue;
        a.grp = null; a.mode = "back"; a.flash = .5;
        const ang = Math.random()*Math.PI*2, f = 40 + Math.random()*140;
        if(to === "orb"){
          setTween(a, { to:"orb", dur:T(650 + Math.random()*350), delay:Math.random()*T(160), ox:Math.cos(ang)*f, oy:Math.sin(ang)*f,
            next:{ to:"home", dur:T(1300 + Math.random()*900), delay:T(250), ox:(Math.random()-.5)*260, oy:(Math.random()-.5)*160 } }, now);
        } else {
          setTween(a, { to:"home", dur:T(1100 + Math.random()*900), delay:Math.random()*T(180), ox:Math.cos(ang)*f*1.6, oy:Math.sin(ang)*f*1.6 }, now);
        }
      }
      energy = Math.max(energy, .7);
    },
    stir(v){ energy = Math.max(energy, v); },
    voice(v){ energy = Math.max(energy, v*.95); },
    ping(a = .4){ pulse = 0; pulseAmp = a; },
    raise(list){ const now = performance.now();
      mounts = list.map(d => ({u:d.u, z:d.z, su:d.su || .006, sz:d.sz || .016, r:d.r, from:0, to:d.r, cur:0, up:true, t0:now + T(d.delay || 0), dur:T(d.dur || 1800)}));
      energy = Math.max(energy, .4); },
    flatten(){ const now = performance.now(); mounts.forEach(m => { m.from = m.cur; m.to = 0; m.up = false; m.t0 = now; m.dur = T(900); }); },
    peak(i){ const m = mounts[i]; if(!m) return null; const p = meshPoint(m.u, m.z); return [p[0], p[1], m.cur/(m.r || 1)]; }
  };
})();

/* text that will be built from particles: laid out as letters, hidden until the dust arrives */
function prep(el, text){
  el.textContent = ""; el.setAttribute("aria-label", text);
  text.split(/(\s+)/).forEach(part => {
    if(!part) return;
    if(/^\s+$/.test(part)){ el.append(document.createTextNode(" ")); return; }
    const w = mk("span","w"); w.setAttribute("aria-hidden","true");
    for(const ch of part){ const c = mk("span","c", ch); c.dataset.ch = ch; w.append(c); }
    el.append(w);
  });
  el.style.opacity = 0;
}
let live = [];
async function formText(el, text, ctx, opts){
  prep(el, text);
  if(RM){ el.style.opacity = 1; return; }
  const grp = field.form(el, opts); live.push(grp);
  await ctx.w(grp.done);
  field.settle(grp);
  el.style.opacity = "";
  await ctx.w(anim(el, [{opacity:0, filter:"blur(5px)", textShadow:"-5px 0 rgba(201,163,92,.8), 5px 0 rgba(147,208,240,.8)"},
                        {opacity:1, filter:"blur(0)", textShadow:"0 0 rgba(201,163,92,0), 0 0 rgba(147,208,240,0)"}], {dur:650, ease:EASE}));
}

const SCENES = {
voice:{ label:"Voz", note:"Mientras Una habla, el orbe abre un anillo de frecuencias que sigue cada sílaba, la malla vibra con la voz y cada palabra se ilumina justo cuando la dice. Activa Sonido para oírla.",
  async run(ctx){
    const text = "Buenos días, Chris. Revisé tus tres obras y hay una cosa que necesita tu atención hoy.";
    const s = build(`<div class="scene vox"><p class="vox-t"></p></div>`);
    tilt.append(s);
    const p = s.querySelector(".vox-t"); p.setAttribute("aria-label", text);
    const words = text.split(" ").map((w, i, all) => { const e = mk("span","vw", w); e.setAttribute("aria-hidden","true"); p.append(e); if(i < all.length - 1) p.append(" "); return e; });
    const plan = []; let at = 0;
    words.forEach(w => { const d = w.textContent.length*62 + 110, pause = /[.,]$/.test(w.textContent) ? 260 : 60; plan.push({w, a:at, b:at + d}); at += d + pause; });
    const total = at;
    if(soundOn && "speechSynthesis" in window && !RM){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = "es-US"; u.rate = 1.02;
      const v = speechSynthesis.getVoices().find(v => /^es/i.test(v.lang)); if(v) u.voice = v;
      speechSynthesis.speak(u);
    }
    anim(s, [{opacity:0},{opacity:1}], {dur:300});
    await new Promise(res => {
      const t0 = performance.now(); let last = -1;
      const tick = now => {
        if(!ctx.alive()){ orb.voice(0); return res(); }
        const t = (now - t0)/speed;
        if(RM || t > total){ words.forEach(w => w.className = "vw said"); orb.voice(0); return res(); }
        let lev = .04;
        plan.forEach((x, i) => {
          if(t >= x.a && t < x.b){
            const q = (t - x.a)/(x.b - x.a);
            lev = Math.pow(Math.sin(Math.PI*q), .6)*(.62 + .38*Math.sin(t/1000*2*Math.PI*6.2))*(.85 + .15*Math.random());
            if(i !== last){ if(last >= 0) plan[last].w.className = "vw said"; x.w.className = "vw now"; if(i % 4 === 0) field.ping(.35); last = i; }
          }
        });
        orb.voice(lev); field.voice(lev);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    return s;
  }},

building:{ label:"Edificio", note:"Torre real de 5660 Collins: la silueta de cada piso viene de los planos RELATS del repo 5660-collins-app, con el retranqueo del 16 y el remate del 21. Se construye nivel por nivel, se separa y el piso 9 sale hacia ti. Gírala y toca cualquier piso.",
  async run(ctx){
    const s = build(`<div class="scene bld"><canvas class="bld-cv" aria-label="Modelo de 5660 Collins, 20 niveles más lobby"></canvas><div class="bld-card" aria-live="polite"><b></b><span></span></div></div>`);
    tilt.append(s);
    const cv = s.querySelector("canvas"), g = cv.getContext("2d"), card = s.querySelector(".bld-card");
    const M = TOWER_5660, ISSUE_LEVEL = 9;

      K = Math.min(CW*.46, CH*.86/(N*FH*Math.cos(.38) + 2*Math.sin(.38) + N*.035)); };

      const p = .38, y2 = y*Math.cos(p) - z1*Math.sin(p), z2 = y*Math.sin(p) + z1*Math.cos(p);
      const f = 6/(6 + z2);
      return [CW/2 + x1*K*f, CH*.52 - y2*K*f, z2];

    const perf = () => performance.now()/1000;
    function ringPath(pts, y, oz){ g.beginPath(); pts.forEach((q, j) => { const p = P(q[0], y, q[1] + oz); j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.closePath(); }
    function floor(i){
      const v = Math.max(0, Math.min(1, st.build - i)); if(v <= 0) return null;
      const F = M.floors[i], sh = M.shapes[F.shape], pts = sh.pts;

      const issue = i === ISSUE, sel = i === st.sel, oz = sel ? st.out*.45 : 0;
      const col = issue ? "201,163,92" : sel ? "230,240,247" : "147,208,240";
      const a = v*(issue || sel ? 1 : .5);
      if(issue || sel){ ringPath(pts, yt, oz); g.fillStyle = `rgba(${col},${(issue ? .15 + .07*Math.sin(perf()*4) : .1)*v})`; g.fill(); }

      ringPath(pts, yt, oz); g.stroke();
      g.strokeStyle = `rgba(${col},${a*.55})`; ringPath(pts, yb, oz); g.stroke();
      g.strokeStyle = `rgba(${col},${a*.4})`; g.lineWidth = .7; g.beginPath();
      for(const c of sh.corners){ const q = pts[c], b = P(q[0], yb, q[1] + oz), t = P(q[0], yt, q[1] + oz); g.moveTo(b[0], b[1]); g.lineTo(t[0], t[1]); }
      g.stroke();

    function ring(y, r, dash, rot, col, a){
      g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = 1; g.setLineDash(dash); g.beginPath();
      for(let j = 0; j <= 72; j++){ const an = j/72*Math.PI*2 + rot, p = P(Math.cos(an)*r, y, Math.sin(an)*r); j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }

      ring(y0, 1.25, [3,5], perf()*.3, "147,208,240", .45);

      const bc = P(0, y0, 0), grd = g.createRadialGradient(bc[0], bc[1], 0, bc[0], bc[1], CH*.5);
      grd.addColorStop(0, "rgba(147,208,240,.13)"); grd.addColorStop(1, "rgba(147,208,240,0)"); g.fillStyle = grd; g.fillRect(0,0,CW,CH);
      let issueF = null;

      if(st.build > 0 && st.build < N + .5){
        const yb = floorBase(Math.min(N-1, Math.floor(st.build))) + FH*(st.build % 1);
        g.fillStyle = "rgba(147,208,240,.10)"; g.strokeStyle = "rgba(147,208,240,.9)"; g.lineWidth = 1.2;

        let right = null; issueF.pts.forEach(q => { const p = P(q[0], issueF.yt, q[1] + issueF.oz); if(!right || p[0] > right[0]) right = p; });
        const lx = CW - 6;
        g.strokeStyle = `rgba(201,163,92,${a})`; g.lineWidth = 1; g.beginPath(); g.moveTo(right[0], right[1]); g.lineTo(Math.min(lx - 90, right[0] + 28), right[1] - 22); g.lineTo(lx, right[1] - 22); g.stroke();

    const tween = (key, to, ms, lin) => new Promise(res => {

      anim(c.querySelector(".dot"), [{transform:"scale(1)"},{transform:"scale(2.2)",boxShadow:"0 0 18px 6px rgba(147,208,240,.7)"},{transform:"scale(1)"}], {dur:600, delay:i*120}));
    const fh = fold.scrollHeight; fold.style.visibility = "";
    anim(fold, [{height:"0px"},{height:fh + "px"}], {dur:900, ease:EASE});
    anim(fold.querySelector(".f1"), [{transform:"rotateX(-90deg)"},{transform:"rotateX(0)"}], {dur:520, ease:"cubic-bezier(.3,1.3,.5,1)"});
    await ctx.w(anim(fold.querySelector(".f2"), [{transform:"rotateX(-178deg)"},{transform:"rotateX(0)"}], {dur:620, delay:380, ease:"cubic-bezier(.3,1.25,.5,1)"}));
    fold.style.height = "auto";
    return s;
  }},
insight:{ label:"Conexión", note:"El núcleo de latón se enciende, las líneas viajan hacia cada obra y la conclusión se condensa desde el polvo justo debajo de la red.",
  async run(ctx){
    const N = [{x:14,y:12,t:"5660 Collins"},{x:86,y:12,t:"Barcelona Gardens"},{x:50,y:60,t:"Ocean Park Manor"}];
    const s = build(`<div class="scene"><div class="net"><svg viewBox="0 0 100 64" preserveAspectRatio="none">
      ${N.map(n => `<line x1="50" y1="30" x2="${n.x}" y2="${n.y}" pathLength="1"/>`).join("")}</svg>
      <i class="hub-ring"></i><i class="hub"></i>
      ${N.map(n => `<div class="node" style="left:${n.x}%;top:${n.y/64*100}%"><i></i><span></span></div>`).join("")}</div><p class="ins"></p></div>`);
    tilt.append(s);
    const ins = s.querySelector(".ins"); prep(ins, "Las tres obras esperan al mismo proveedor de pintura");
    await ctx.w(beam(s));
    anim(s.querySelector(".hub"), [{transform:"scale(0)"},{transform:"scale(1.25)"},{transform:"scale(1)"}], {dur:600, ease:EASE});
    anim(s.querySelector(".hub-ring"), [{opacity:.9,transform:"scale(1)"},{opacity:0,transform:"scale(4)"}], {dur:900, delay:200, ease:"ease-out"});
    await ctx.sleep(350);
    const lines = s.querySelectorAll("line"), nodes = s.querySelectorAll(".node");
    lines.forEach((l,i) => anim(l, [{strokeDashoffset:1},{strokeDashoffset:0}], {dur:600, delay:i*180, ease:SNAP}));
    nodes.forEach((n,i) => {
      anim(n, [{opacity:0,transform:"translate(-50%,-50%) scale(.3)"},{opacity:1,transform:"translate(-50%,-50%) scale(1)"}], {dur:450, delay:520 + i*180, ease:BACK});
      decode(n.querySelector("span"), N[i].t, ctx, {dur:550, delay:560 + i*180});
    });
    await ctx.sleep(900);
    await ctx.w(formText(ins, "Las tres obras esperan al mismo proveedor de pintura", ctx, {max:1400}));
    return s;
  }},
action:{ label:"Acción", note:"La acción se ensambla como una armadura: los rieles se extienden, las esquinas giran y encajan con un destello, los anillos de la mira se traban, las compuertas se abren y la carga avanza celda por celda. Es una propuesta; Una no ejecuta nada sin tu aprobación.",
  async run(ctx){
    const s = build(`<div class="scene mech">
      <i class="rail t"></i><i class="rail b"></i><i class="rail l"></i><i class="rail r"></i>
      <i class="pc tl"></i><i class="pc tr"></i><i class="pc bl"></i><i class="pc bb"></i>
      <svg class="rings" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="r1" cx="22" cy="22" r="19" pathLength="12"/><circle class="r2" cx="22" cy="22" r="13" pathLength="8"/>
        <circle class="r3" cx="22" cy="22" r="6.5"/><path d="M22 0v6M22 38v6M0 22h6M38 22h6"/></svg>
      <div class="shut"><p class="act">Envía los planos revisados al inspector antes del lunes</p><i class="sh t"></i><i class="sh b"></i></div>
      <div class="cells">${"<i></i>".repeat(12)}</div><p class="charge-lab">Lista para tu aprobación</p></div>`);
    tilt.append(s);
    const MECH = "cubic-bezier(.8,0,.15,1)";
    const clank = el => anim(el, [{filter:"drop-shadow(0 0 10px rgba(255,220,150,1)) brightness(2)"},{filter:"drop-shadow(0 0 0 rgba(255,220,150,0)) brightness(1)"}], {dur:380});
    s.querySelectorAll(".pc,.rings,.cells,.charge-lab").forEach(e => e.style.opacity = 0);
    beam(s);
    const rails = s.querySelectorAll(".rail");
    rails.forEach((r,i) => anim(r, [{transform:r.matches(".l,.r") ? "scaleY(0)" : "scaleX(0)"},{transform:"none"}], {dur:420, delay:i*70, ease:MECH}));
    await ctx.sleep(380);
    const from = {tl:"translate(-70px,-50px) rotate(-180deg)", tr:"translate(70px,-50px) rotate(180deg)", bl:"translate(-70px,50px) rotate(180deg)", bb:"translate(70px,50px) rotate(-180deg)"};
    for(const p of s.querySelectorAll(".pc")){
      p.style.opacity = "";
      anim(p, [{transform:from[p.classList[1]] + " scale(1.6)",opacity:0},{opacity:1,offset:.3},{transform:"none",opacity:1}], {dur:480, ease:MECH}).then(() => clank(p));
      await ctx.sleep(110);
    }
    await ctx.sleep(380);
    anim(s, [{transform:"translate(0,0)"},{transform:"translate(0,3px)"},{transform:"translate(0,-1px)"},{transform:"translate(0,0)"}], {dur:200, ease:"linear"});
    field.stir(.6);
    const rings = s.querySelector(".rings"); rings.style.opacity = "";
    anim(rings, [{opacity:0,transform:"scale(1.8)"},{opacity:1,transform:"none"}], {dur:300, ease:MECH});
    const [r1, r2, r3] = rings.querySelectorAll("circle");
    [r1, r2, r3].forEach(r => r.style.transformOrigin = "22px 22px");
    anim(r1, [{transform:"rotate(-270deg)"},{transform:"rotate(0)"}], {dur:900, ease:MECH});
    anim(r2, [{transform:"rotate(300deg)"},{transform:"rotate(0)"}], {dur:900, delay:120, ease:MECH});
    await ctx.w(anim(r3, [{transform:"scale(0)"},{transform:"scale(1.3)",offset:.7},{transform:"scale(1)"}], {dur:600, delay:500, ease:EASE}));
    clank(rings);
    const [st, sb] = s.querySelectorAll(".sh");
    anim(st, [{transform:"translateY(0)"},{transform:"translateY(3px)",offset:.15},{transform:"translateY(-103%)"}], {dur:700, ease:MECH});
    await ctx.w(anim(sb, [{transform:"translateY(0)"},{transform:"translateY(-3px)",offset:.15},{transform:"translateY(103%)"}], {dur:700, ease:MECH}));
    const cells = s.querySelector(".cells"); cells.style.opacity = "";
    anim(cells, [{opacity:0},{opacity:1}], {dur:200});
    cells.querySelectorAll("i").forEach((c,i) => anim(c, [{background:"#1F3D5E",boxShadow:"0 0 0 rgba(201,163,92,0)"},{background:"#C9A35C",boxShadow:"0 0 8px rgba(201,163,92,.8)"}], {dur:90, delay:200 + i*85, ease:"steps(1)"}));
    await ctx.sleep(200 + 12*85 + 100);
    const lab = s.querySelector(".charge-lab"); lab.style.opacity = "";
    await ctx.w(anim(lab, [{opacity:0},{opacity:1}], {dur:400}));
    return s;
  }}

};

/* ---------- mandala: the orb thinking ---------- */
const mandala = (() => {
  const svg = $("#mandala"), NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); parent.append(e); return e; };
  const G = [el("g",{},svg), el("g",{},svg), el("g",{},svg), el("g",{},svg)];
  el("circle",{r:104, class:"ln", opacity:.6}, G[0]);
  for(let i = 0; i < 120; i++){ const a = i/120*Math.PI*2, r2 = i % 10 ? 99 : 93;
    el("line",{x1:Math.cos(a)*104, y1:Math.sin(a)*104, x2:Math.cos(a)*r2, y2:Math.sin(a)*r2, class:"ln", opacity:i % 10 ? .45 : .9}, G[0]); }
  el("circle",{r:87, class:"sk", "stroke-dasharray":"46 9", opacity:.7}, G[1]);
  el("path",{id:"mpath", d:"M -76 0 A 76 76 0 1 1 76 0 A 76 76 0 1 1 -76 0", fill:"none"}, G[1]);
  const tx = el("text",{}, G[1]); const tp = el("textPath",{href:"#mpath"}, tx);
  const sq = 45;
  el("rect",{x:-sq, y:-sq, width:sq*2, height:sq*2, class:"ln"}, G[2]);
  el("rect",{x:-sq, y:-sq, width:sq*2, height:sq*2, class:"ln", transform:"rotate(45)"}, G[2]);
  el("circle",{r:64, class:"ln", opacity:.8}, G[2]);
  for(let i = 0; i < 8; i++){ const a = i/8*Math.PI*2; el("circle",{cx:Math.cos(a)*64, cy:Math.sin(a)*64, r:3.2, fill:"#04070C", class:"ln"}, G[2]); }
  el("circle",{r:52, class:"sk", "stroke-dasharray":"2 3", opacity:.8}, G[3]);
  el("path",{d:"M -60 0 H -54 M 54 0 H 60 M 0 -60 V -54 M 0 54 V 60", class:"sk"}, G[3]);
  let spins = [];
  return {
    async think(ctx, ms, label){
      tp.textContent = `${label}     ${label}     `;
      spins.forEach(a => a.cancel());
      if(RM){ svg.style.opacity = .8; await ctx.sleep(ms); svg.style.opacity = 0; return; }
      spins = [[0, 26000, 1], [1, 15000, -1], [2, 9000, 1], [3, 6000, -1]].map(([i, d, dir]) =>
        G[i].animate([{transform:"rotate(0deg)"},{transform:`rotate(${360*dir}deg)`}], {duration:d*speed, iterations:Infinity}));
      anim(svg, [{opacity:0, transform:"scale(.4) rotate(-90deg)"},{opacity:1, transform:"none"}], {dur:650, ease:"cubic-bezier(.2,1.3,.4,1)"});
      G.forEach((g, i) => anim(g, [{opacity:0},{opacity:1}], {dur:300, delay:i*110}));
      const iv = setInterval(() => orb.flash(.35), T(420));
      try { await ctx.sleep(ms); }
      finally { clearInterval(iv); }
      await ctx.w(anim(svg, [{opacity:1, transform:"none", filter:"blur(0)"},{opacity:0, transform:"scale(1.25)", filter:"blur(4px)"}], {dur:380, ease:"cubic-bezier(.6,0,.8,.3)"}));
    },
    stop(){ svg.getAnimations().forEach(a => a.cancel()); spins.forEach(a => a.cancel()); svg.style.opacity = 0; }
  };
})();

/* leaving: the words burst back into dust and the mesh knits itself together again */
function leave(s){
  field.release(live); live = []; field.flatten(); s.cleanup?.(); tilt.style.alignSelf = "";
  return anim(s, [{opacity:1,transform:"none",filter:"blur(0)"},{opacity:0,transform:"translateY(-18px) scale(.97)",filter:"blur(8px)"}], {dur:320, ease:"cubic-bezier(.6,0,.8,.3)"})
    .then(() => s.remove());
}
/* returning: everything is drawn into the orb, then the orb sprays the mesh back out */
async function absorb(s, ctx){
  field.release(live, "orb"); live = []; field.flatten(); s.cleanup?.();
  const [ox, oy] = orb.center(), r = s.getBoundingClientRect();
  const dx = ox - (r.left + r.width/2), dy = oy - (r.top + r.height/2);
  orb.suck();
  await ctx.w(anim(s, [{transform:"none",opacity:1,filter:"blur(0)"},{transform:`translate(${dx}px,${dy}px) scale(.04)`,opacity:0,filter:"blur(10px)"}], {dur:700, ease:"cubic-bezier(.7,0,.85,.2)"}));
  s.remove();
}

/* ---------- throw a hologram into the orb ---------- */
let curScene = null, onThrown = null, throwing = false;
function hold(ctx, ms){
  return ctx.w(new Promise(r => {
    const t = setTimeout(() => { onThrown = null; r(false); }, Math.min(T(ms), 2e9));
    onThrown = () => { clearTimeout(t); onThrown = null; r(true); };
  }));
}
function burst(x, y){
  for(let i = 0; i < 26; i++){
    const p = mk("i", i % 3 ? "px" : "px b"); p.style.left = x + "px"; p.style.top = y + "px"; fx.append(p);
    const a = Math.random()*Math.PI*2, d = 30 + Math.random()*70;
    p.animate([{transform:"none", opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`, opacity:0}], {duration:T(500 + Math.random()*400), easing:"cubic-bezier(.2,.8,.2,1)", fill:"both"}).finished.then(() => p.remove(), () => {});
  }
}
(() => {
  const stage = $("#stage"); let drag = null;
  stage.addEventListener("pointerdown", e => {
    if(!curScene || throwing || RM) return;
    const s = curScene, r = s.getBoundingClientRect();
    drag = { s, x:e.clientX, y:e.clientY, cx:r.left + r.width/2, cy:r.top + r.height/2, hist:[[e.clientX, e.clientY, performance.now()]] };
    s.getAnimations().forEach(a => { a.commitStyles?.(); a.cancel(); });
    stage.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
  });
  stage.addEventListener("pointermove", e => {
    if(!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.hist.push([e.clientX, e.clientY, performance.now()]); if(drag.hist.length > 6) drag.hist.shift();
    drag.s.style.transform = `translate(${dx}px,${dy}px) rotate(${dx*.04}deg) scale(${1 - Math.min(.08, Math.hypot(dx, dy)/2000)})`;
    field.stir(Math.min(.6, Math.hypot(dx, dy)/400));
  });
  const end = e => {
    if(!drag) return;
    const d = drag; drag = null; document.body.classList.remove("dragging");
    const dx = e.clientX - d.x, dy = e.clientY - d.y, h = d.hist, a = h[0], b = h[h.length - 1];
    const dt = Math.max(16, b[2] - a[2]), vx = (b[0] - a[0])/dt*16, vy = (b[1] - a[1])/dt*16, sp = Math.hypot(vx, vy);
    if(sp > 9 || dy < -150 || Math.hypot(dx, dy) > 190) fling(d.s, dx, dy, vx, vy, d.cx, d.cy);
    else d.s.animate([{transform:d.s.style.transform},{transform:"none"}], {duration:T(500), easing:BACK}).finished.then(() => { d.s.style.transform = ""; }, () => {});
  };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);

  function fling(s, x, y, vx, vy, cx, cy){
    throwing = true; curScene = null;
    const myRun = runId;
    field.release(live, "orb"); live = []; field.flatten(); s.cleanup?.();
    let rot = x*.04, sc = 1, d0 = 0;
    const cap = Math.hypot(vx, vy); if(cap > 26){ vx *= 26/cap; vy *= 26/cap; }
    const tick = () => {
      if(myRun !== runId){ throwing = false; return; }
      const [ox, oy] = orb.center(), tx = ox - cx, ty = oy - cy;
      const ddx = tx - x, ddy = ty - y, dist = Math.hypot(ddx, ddy);
      if(!d0) d0 = Math.max(dist, 200);
      vx = vx*.94 + ddx*.011; vy = vy*.94 + ddy*.011;
      x += vx; y += vy; rot += vx*.3; sc = Math.max(.04, Math.min(sc, .15 + .85*dist/d0));
      s.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${sc})`;
      s.style.opacity = Math.min(1, sc*2.2);
      if(dist < 22){
        s.remove(); orb.suck(); burst(ox, oy); field.stir(1); field.ping(.6);
        throwing = false; onThrown?.(); return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();

const ORDER = ["voice","headline","number","building","barcelona","evidence","mail","insight","action"];
const THINK = { voice:"buscando en JobTread", building:"leyendo planos de 5660 Collins", barcelona:"leyendo marcas de NV5", mail:"revisando tu Gmail" };
const EXTRA = {
  full:{ label:"Respuesta completa", note:"Una respuesta entera en bucle: el orbe piensa, habla, y cada cuadro llega con su propia física. Al final todo regresa al orbe." },
  think:{ label:"Pensando", note:"Mientras Una busca, un mandala de latón con marcas de plano se abre detrás del orbe. Sus anillos giran en sentidos opuestos y el texto del borde dice qué está consultando." },
  absorb:{ label:"Regreso al orbe", note:"Al deslizar hacia abajo, cada partícula de las letras es tragada por el orbe; el orbe se contrae y luego rocía el polvo de vuelta hasta rearmar la malla." }
};

function reset(){
  runId++;
  tilt.getAnimations({subtree:true}).forEach(a => a.cancel());
  tilt.replaceChildren(); fx.replaceChildren();
  field.release(live); live = []; field.flatten(); tilt.style.alignSelf = "";
  curScene = null; onThrown = null; throwing = false;
  mandala.stop(); orb.voice(0);
  if("speechSynthesis" in window) speechSynthesis.cancel();
  return ctxFor(runId);
}
async function play(key){
  current = key; setChip(key);
  const ctx = reset();
  try{
    if(key === "full"){
      while(ctx.alive()){
        for(const k of ORDER){
          setChip(k, true);
          if(THINK[k]) await mandala.think(ctx, 1300, THINK[k]);
          const s = await SCENES[k].run(ctx);
          curScene = s;
          const thrown = await hold(ctx, k === "voice" ? 700 : 1900);
          curScene = null;
          if(!thrown){ if(k === ORDER.at(-1)) await absorb(s, ctx); else await ctx.w(leave(s)); }
          await ctx.sleep(450);
        }
        setChip("full");
        await ctx.sleep(2600);
      }
    } else if(key === "think"){
      while(ctx.alive()){ await mandala.think(ctx, 3400, "buscando en JobTread"); await ctx.sleep(700); }
    } else if(key === "absorb"){
      const s = await SCENES.headline.run(ctx);
      await ctx.sleep(1000);
      await absorb(s, ctx);
    } else {
      while(ctx.alive()){
        if(THINK[key]) await mandala.think(ctx, 1300, THINK[key]);
        const s = await SCENES[key].run(ctx);
        curScene = s;
        const thrown = await hold(ctx, 1e9);
        curScene = null;
        if(!thrown) break;
        await ctx.sleep(800);
      }
    }
  } catch(e){ if(e !== STOP) throw e; }
}

/* ---------- UI ---------- */
let soundOn = false;
const chips = $("#chips"), keys = ["full", "think", ...ORDER, "absorb"];
const info = k => SCENES[k] || EXTRA[k];
keys.forEach(k => { const b = mk("button","chip", info(k).label); b.type = "button"; b.dataset.k = k; b.onclick = () => play(k); chips.append(b); });
function setChip(k, inSequence){
  chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-current", String(b.dataset.k === k || (inSequence && b.dataset.k === "full"))));
  note.textContent = info(k).note;
}
$("#replay").onclick = () => play(current);
$("#slow").onclick = e => { speed = speed === 1 ? 4 : 1; e.currentTarget.setAttribute("aria-pressed", String(speed !== 1)); play(current); };
$("#sound").onclick = e => { soundOn = !soundOn; e.currentTarget.setAttribute("aria-pressed", String(soundOn)); if(soundOn) play("voice"); else if("speechSynthesis" in window) speechSynthesis.cancel(); };
if("speechSynthesis" in window) speechSynthesis.getVoices();

document.fonts.ready.then(() => play("full"));
})();
</script>
